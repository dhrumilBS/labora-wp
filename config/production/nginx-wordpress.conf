# Labora on WordPress: recommended Nginx server block (PHP-FPM). A starting point, finalized on the live server.
# Set server_name, root, the PHP-FPM socket and the certificate paths, then: nginx -t && systemctl reload nginx
#
# Works with WP Super Cache in "Expert" mode (static files served by Nginx without PHP); see the cache block below.

server {
    listen 80;
    listen [::]:80;
    server_name www.labora.example labora.example;
    return 301 https://www.labora.example$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name labora.example;
    ssl_certificate     /etc/letsencrypt/live/labora.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labora.example/privkey.pem;
    return 301 https://www.labora.example$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.labora.example;
    ssl_certificate     /etc/letsencrypt/live/labora.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labora.example/privkey.pem;

    root /var/www/labora;
    index index.php;
    client_max_body_size 40m;   # media uploads

    # ---- Compression ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/ld+json image/svg+xml text/xml application/xml;

    # ---- Security headers ----
    # A Content-Security-Policy is not set here: the WordPress admin, Yoast, and Contact Form 7 need inline
    # scripts. Add one after testing (start with Content-Security-Policy-Report-Only).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- Block sensitive files ----
    location ~* /(?:wp-config\.php|readme\.html|license\.txt|xmlrpc\.php)$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }                       # .git, .htaccess, .env
    location ~* ^/(?:config|scripts|backups)/ { deny all; }          # repository folders, if deployed with the code
    location ~* ^/wp-content/uploads/.*\.(?:php|phtml|phar)$ { deny all; }
    location ~* ^/wp-content/(?:debug\.log|upgrade/) { deny all; }

    # ---- WP Super Cache, Expert mode: serve cached HTML without PHP ----
    set $cache_uri $request_uri;
    if ($request_method = POST)                                 { set $cache_uri 'null cache'; }
    if ($query_string != "")                                    { set $cache_uri 'null cache'; }
    if ($request_uri ~* "(/wp-admin/|/xmlrpc.php|/wp-(app|cron|login|register|mail).php|wp-.*\.php|/feed/|index.php|sitemap(_index)?\.xml)") { set $cache_uri 'null cache'; }
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_logged_in") { set $cache_uri 'null cache'; }

    location / {
        try_files /wp-content/cache/supercache/$http_host${cache_uri}index-https.html $uri $uri/ /index.php?$args;
    }

    # ---- PHP ----
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    # ---- Static assets: long cache (theme files carry ?ver= so a deploy busts them) ----
    location ~* \.(?:css|js|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
    location ~* \.(?:webp|avif|jpg|jpeg|png|gif|svg|ico|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Limit login attempts at the server too (Wordfence handles the application side)
    location = /wp-login.php {
        limit_req zone=wp_login burst=5 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}

# Put this in the http {} block (nginx.conf), once:
#   limit_req_zone $binary_remote_addr zone=wp_login:10m rate=10r/m;
